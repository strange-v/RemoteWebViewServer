<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self-test</title>
  <style>
    :root {
      --bg-card: #23242b;
      --bg-led: #7f7f79;
      --bg-button: #045694;
      --shadow-key: 0,0,0;
      --shadow-ambient: 0,0,0;

      --elev-1: 0 1px 2px rgba(var(--shadow-key), .60),
            0 1px 3px rgba(var(--shadow-ambient), .38),
            0 0 0 1px rgba(255,255,255,.04);
    }
    body {
      padding: 0;
      margin: 0;
      background: #101215;
      color: #fff;
      font: 14px "Segoe UI", Arial, sans-serif;
      box-sizing: border-box;
    }
    .header {
      height: 40px;
      display: flex;
      gap:8px;
      margin-bottom: 16px;
    }
    .header .tab {
      display: flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
    }
    .header .tab:nth-child(2) {
      border-bottom: 2px solid #fff;
    }
    .chips {
      display:flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .chip {
      display: flex;
      height: 32px;
      border-radius: 16px;
      padding-right: 12px;
      background-color: var(--bg-card);
      box-shadow: var(--elev-1);
    }
    .chip .icon {
      display: inline-block;
      margin: 4px 4px 4px 8px;
      color: #e08a00;
    }
    .chip .value {
      display: inline-block;
      line-height:32px;
    }

    .section-title {
      margin-bottom: 4px;
      margin-left: 8px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 4px;
    }
    .button {
      display: flex;
      flex-grow: 1;
      flex: 1 1 30%;
      height: 40px;
      margin-bottom: 8px;
      border-radius: 12px;
      transition: background-color .5s ease;
      background-color: var(--bg-card);
      box-shadow: var(--elev-1);
      overflow: hidden;
    }
    .button.on, .button:hover {
      transition: background-color .5s ease;
      background-color: var(--bg-button);
    }
    .button .icon {
      display: inline-block;
      margin: 8px 4px 8px 8px;
      color: #fff;
      z-index: 10;
    }
    .button .text {
      display: inline-block;
      line-height:40px;
      z-index: 10;
    }

    .sliders {
      margin: 8px 4px;
    }
    .slider {
      position: relative;
      display: flex;
      height: 40px;
      margin-bottom: 8px;
      border-radius: 12px;
      background-color: var(--bg-card);
      box-shadow: var(--elev-1);
      overflow: hidden;
    }
    .slider .icon {
      display: inline-block;
      margin: 8px 4px 8px 8px;
      color: #e08a00;
      z-index: 10;
    }
    .slider .text {
      display: inline-block;
      line-height:40px;
      z-index: 10;
    }
    .slider .bar {
      position: absolute;
      height: 40px;
      left: 0;
      top: 0;
      background-color: var(--bg-led);
      z-index: 9;
      transition: width .5s ease;
    }


    body.inverted { filter: invert(1); }
    body.no-transition * { transition: none !important; }

    #banner {
      position: fixed;
      right: 6px;
      bottom: 4px;
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      font-size: 12px;
      color: #bbb;
    }

    #result {
      display: none;
      position: fixed;
      inset: 0;
      overflow: auto;
      padding: 8px;
      background: #000;
      z-index: 11;
      /* Sized for small displays: ~17px on 480px wide, 12px minimum, 22px maximum. */
      font-size: clamp(12px, 3.6vw, 22px);
      line-height: 1.3;
    }
    #result h1 { font-size: 1.15em; margin: 0 0 .3em; color: #aaa; font-weight: normal; }
    #result .verdict { font-size: 1.3em; margin-bottom: .5em; }
    #result .verdict div { margin-bottom: .15em; }
    #result .verdict b { color: #e08a00; }
    #result table { border-collapse: collapse; width: 100%; margin-bottom: .6em; }
    #result th, #result td { padding: .2em .3em; text-align: right; border-bottom: 1px solid #333; white-space: nowrap; }
    #result th { color: #aaa; font-weight: normal; }
    #result td.limit { color: #e08a00; font-weight: bold; }
    #result td.best { color: #4caf50; font-weight: bold; }
    #result th:first-child, #result td:first-child { text-align: left; white-space: normal; }
    #result ul { margin: 0; padding-left: 1.1em; }
    #result li { margin-bottom: .4em; }
  </style>
</head>

  <div id="banner"></div>
  <div id="result"><h1>Self-test results</h1><div id="result-body">Waiting for results…</div></div>
  <script>
    // Each stage makes a series of changes, one at a time: after a change the page reports a
    // "step" and waits until the server says the device has drawn it (rwvContinue). The device
    // therefore never gets more than one frame at a time - it has no flow control of its own.
    const send = (msg) => {
      try { if (window.rwvSelfTest) window.rwvSelfTest(JSON.stringify(msg)); } catch (e) { }
    };
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const $ = (id) => document.getElementById(id);

    let power = 60;
    const STAGES = [
      {
        name: 'small', label: 'Small change', steps: 15,
        // A sensor value changes.
        change: () => { power += 42; $('power').innerText = `${power} W`; },
      },
      {
        name: 'partial', label: 'Partial', steps: 15,
        // A card and two sliders change: a part of the screen.
        change: (i) => {
          $(`button${i % 6}`).classList.toggle('on');
          $('bar0').style.width = `${(i * 37 + 20) % 101}%`;
          $('bar1').style.width = `${(i * 53 + 70) % 101}%`;
        },
      },
      {
        name: 'full', label: 'Full screen', steps: 10,
        // Every pixel changes, like switching pages. An even count ends in the original state.
        change: () => document.body.classList.toggle('inverted'),
      },
    ];

    // Resolves when the server calls rwvContinue (with an optional value), or on timeout.
    function waitForContinue(timeoutMs) {
      return new Promise(resolve => {
        const timer = setTimeout(() => done(undefined), timeoutMs);
        function done(value) { clearTimeout(timer); window.rwvContinue = null; resolve(value); }
        window.rwvContinue = done;
      });
    }

    // Changes the whole screen on every browser frame for durationMs, like scrolling.
    function burst(durationMs) {
      return new Promise(resolve => {
        const t0 = performance.now();
        const tick = (t) => {
          document.body.classList.toggle('inverted');
          if (t - t0 < durationMs) requestAnimationFrame(tick);
          else resolve();
        };
        requestAnimationFrame(tick);
      });
    }

    async function runTest() {
      await sleep(2000);
      document.body.classList.add('no-transition'); // one change = one frame
      for (let i = 0; i < STAGES.length; i++) {
        const s = STAGES[i];
        $('banner').innerText = `Self-test ${i + 1}/${STAGES.length}: ${s.label}`;
        await sleep(1000); // keep the banner update out of the measurement
        send({ type: 'stage-start', name: s.name, label: s.label });
        for (let n = 0; n < s.steps; n++) {
          const drawn = waitForContinue(3000);
          s.change(n);
          send({ type: 'step' });
          await drawn;
          await sleep(150); // let the device breathe between frames
        }
        send({ type: 'stage-end', name: s.name });
        await sleep(500);
      }

      // Scrolling: bursts of full-screen changes, each at a min_frame_interval the server
      // picks from the results so far. Each ends once the device has caught up.
      const plan = waitForContinue(3000);
      send({ type: 'burst-plan' });
      const bursts = (await plan) || 0;
      for (let i = 0; i < bursts; i++) {
        $('banner').innerText = `Self-test: scrolling ${i + 1}/${bursts}`;
        await sleep(1000);
        send({ type: 'stage-start', name: `burst${i}`, label: `Scrolling ${i + 1}`, burst: i });
        await burst(2000);
        if (document.body.classList.contains('inverted')) document.body.classList.remove('inverted');
        const caughtUp = waitForContinue(12_000);
        send({ type: 'stage-end', name: `burst${i}` });
        await caughtUp;
        await sleep(500);
      }
      document.body.classList.remove('no-transition');
      $('banner').innerText = 'Self-test: collecting results…';
      send({ type: 'done' });
    }

    function el(tag, text) {
      const e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      return e;
    }

    window.rwvShowResult = (report) => {
      const body = $('result-body');
      body.textContent = '';

      // The verdict first, in large type: it's what the test is run for.
      const names = { device: 'device', server: 'server CPU', network: 'network', browser: 'browser' };
      const verdict = el('div');
      verdict.className = 'verdict';
      const line = (label, value, note) => {
        const d = el('div', `${label}: `);
        d.appendChild(el('b', value));
        if (note) d.appendChild(el('span', ` (${note})`));
        verdict.appendChild(d);
      };
      // How long a change takes to appear on the device, and what limits it.
      const stage = (n) => report.stages.find(s => s.name === n);
      for (const [n, label] of [['small', 'Small change'], ['full', 'Full screen']]) {
        const s = stage(n);
        if (s) line(label, `${s.latencyMs} ms`, `limit: ${names[s.limit]}`);
        else line(label, 'no data');
      }
      if (report.recommendedMinFrameIntervalMs !== undefined) {
        // Measured while scrolling: the lowest interval at which the screen keeps up.
        line('min_frame_interval', `${report.recommendedMinFrameIntervalMs} ms`);
      } else {
        // Estimates: smooth animations / no lag on full-screen changes (explained below).
        const mfi = report.minFrameInterval || {};
        const mfiValues = [mfi.smoothMs, mfi.noLagMs].filter(v => v !== undefined);
        if (mfiValues.length)
          line('min_frame_interval', `${[...new Set(mfiValues)].join(' / ')} ms`);
      }
      body.appendChild(verdict);

      // Where the time goes per stage (medians, ms); the largest part is highlighted.
      // Max values are in the server log.
      const short = { small: 'Small', partial: 'Partial', full: 'Full' };
      const table = el('table');
      const head = el('tr');
      for (const h of ['', 'KB', 'Total', 'Browser', 'Server', 'Net', 'Device']) head.appendChild(el('th', h));
      table.appendChild(head);
      for (const s of report.stages) {
        const row = el('tr');
        for (const c of [short[s.name] || s.label, s.kbPerFrame, s.latencyMs]) row.appendChild(el('td', String(c)));
        for (const part of ['browser', 'server', 'network', 'device']) {
          const td = el('td', String(s[`${part}Ms`]));
          if (part === s.limit) td.className = 'limit';
          row.appendChild(td);
        }
        table.appendChild(row);
      }
      body.appendChild(table);

      // Scrolling bursts per min_frame_interval; the recommended one is highlighted.
      if (report.bursts && report.bursts.length) {
        const bt = el('table');
        const bh = el('tr');
        for (const h of ['Scrolling at', 'fps', 'Behind']) bh.appendChild(el('th', h));
        bt.appendChild(bh);
        for (const b of report.bursts) {
          const row = el('tr');
          const behind = b.timedOut ? '> 10 s' : `${b.lagMs} ms`;
          for (const c of [`${b.intervalMs} ms`, b.fps, behind]) row.appendChild(el('td', String(c)));
          if (b.intervalMs === report.recommendedMinFrameIntervalMs) row.firstChild.className = 'best';
          if (b.lagging) row.lastChild.className = 'limit';
          bt.appendChild(row);
        }
        body.appendChild(bt);
      }

      const list = el('ul');
      for (const r of report.recommendations) list.appendChild(el('li', r));
      body.appendChild(list);
    };

    if (new URLSearchParams(location.search).get('view') === 'result') {
      $('result').style.display = 'block';
      send({ type: 'result-ready' });
    } else {
      runTest();
    }
  </script>
</body>
</html>
